# Repository-root entry point for Docker Compose.
#
# The service definitions live in docker/docker-compose.yml; this file only
# includes them so that Compose's PROJECT DIRECTORY is the repository root.
# That matters because ${VAR} interpolation (the admin-UI publish host and
# port in docker/docker-compose.yml) reads the .env from the project
# directory. Running `cd docker && docker compose ...` instead makes the
# project directory docker/, the root .env is not loaded, and a custom
# WECOM_FORWARD_PLUS_ADMIN_PORT would silently fall back to the default.
# (The PostgreSQL password is not affected: the postgres service reads it
# from ../.env via env_file, which resolves relative to the compose file
# and works from any invocation directory.)
#
# Run from the repository root:
#     cp .env.example .env   # then fill in real values
#     docker compose up -d --build
#     docker compose logs -f
#     docker compose down
include:
  - path: docker/docker-compose.yml
