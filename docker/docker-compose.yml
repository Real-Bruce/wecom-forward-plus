# Run wecom-forward-plus on a server.
#
# Copy `.env.example` to `.env` in the repository root and fill in real
# values, then from this directory:
#     docker compose up -d --build
#
# The build context is the repository root (parent of this directory), so
# Dockerfile COPY paths are relative to the repo root. Configuration is
# injected via `env_file`; the container does not need a copy of `.env`
# inside it. Rotating logs are written to ../logs on the host.
#
# The optional `postgres` service below serves the runtime group
# configuration (CONFIG_SOURCE=database in .env). Delete the service and the
# `depends_on` block if you point WECOM_FORWARD_PLUS_DATABASE_URL at an
# external PostgreSQL instance instead.

services:
  wecom-forward-plus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: wecom-forward-plus:latest
    container_name: wecom-forward-plus
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # Persist rotating log files (logs/app.log) to the host.
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: wecom-forward-plus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wecom
      POSTGRES_PASSWORD: ${WECOM_POSTGRES_PASSWORD:?set WECOM_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wecom
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wecom -d wecom"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
